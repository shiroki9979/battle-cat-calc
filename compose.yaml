name: battle-cat-calc

x-sdk: &sdk
  image: battle-cat-calc-sdk
  platform: linux/amd64
  build:
    context: .
    dockerfile: dotnet/Dockerfile
    target: sdk
    args:
      DEV_UID: ${DEV_UID:-1000}
      DEV_GID: ${DEV_GID:-1000}
  volumes:
    - type: bind
      source: ./dotnet
      target: /workspace/dotnet
      bind:
        create_host_path: false
    - type: bind
      source: ./tests/fixtures
      target: /workspace/tests/fixtures
      read_only: true
      bind:
        create_host_path: false
    - nuget:/home/app/.nuget/packages
    - artifacts:/artifacts
    - client_modules:/workspace/dotnet/client/node_modules
    - client_dist:/workspace/dotnet/client/dist
    - type: bind
      source: ./test-results
      target: /test-results
      bind:
        create_host_path: false

services:
  sdk:
    <<: *sdk
    profiles: [tools]
  test:
    <<: *sdk
    profiles: [tools]
    entrypoint: [dotnet, test, BattleCatCalc.slnx, --logger, trx, --collect, "XPlat Code Coverage", --results-directory, /test-results]
    command: []
  client:
    <<: *sdk
    profiles: [tools]
    working_dir: /workspace/dotnet/client
    environment:
      API_PROXY_TARGET: http://sdk:8080
    ports:
      - "5173:5173"
    command: [sh, -c, "npm ci && exec npm run dev -- --host 0.0.0.0"]
  e2e:
    <<: *sdk
    image: battle-cat-calc-e2e
    profiles: [tools]
    build:
      context: .
      dockerfile: dotnet/Dockerfile
      target: e2e
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    environment:
      CI: "true"
      PLAYWRIGHT_HTML_REPORT: /test-results/playwright-report
      PLAYWRIGHT_OUTPUT_DIR: /test-results/playwright-results
    command: []
  api:
    image: battle-cat-calc-api
    platform: linux/amd64
    build:
      context: .
      dockerfile: dotnet/Dockerfile
      target: runtime
    ports:
      - "5096:8080"
    volumes:
      - logs:/app/logs

volumes:
  nuget:
  artifacts:
  client_modules:
  client_dist:
  logs:
